spring.application.name=api

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Lee variables de entorno con fallback a valores por defecto para desarrollo local.
# Para cambiar de entorno (local → Docker → OCI), definir las variables en .env
# sin necesidad de modificar este archivo. (BUG-2 — resuelto 2026-07-27)
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:techmind}
spring.datasource.username=${PG_USER:techmind_user}
spring.datasource.password=${PG_PASSWORD:techmind_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# Flyway maneja el esquema -> Hibernate solo valida, no lo modifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── Servicio de Data Science (FastAPI) ─────────────────────────────────────────
techmind.ds.api.url=${TECHMIND_DS_API_URL:http://localhost:8000}

# ── Spring Boot Actuator ───────────────────────────────────────────────────────
# Solo expone /actuator/health (no métricas ni info sensible)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Permite que el frontend consulte /actuator/health sin problemas de CORS
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET